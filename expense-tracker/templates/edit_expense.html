{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-title">Edit Expense</h1>
      <p class="auth-subtitle">Update your spending entry</p>
    </div>

    <div class="auth-card">
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/expenses/{{ expense.id }}/edit">
        <div class="form-group">
          <label for="amount">Amount</label>
          <input
            type="number"
            id="amount"
            name="amount"
            class="form-input"
            step="0.01"
            min="0.01"
            placeholder="0.00"
            value="{{ amount if amount is defined else expense.amount }}"
            required
          >
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" class="form-input" required>
            <option value="" disabled>Select a category</option>
            {% set selected_cat = category if category is defined else expense.category %}
            {% for cat in categories %}
            <option value="{{ cat }}" {% if selected_cat == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input
            type="date"
            id="date"
            name="date"
            class="form-input"
            value="{{ date if date is defined else expense.date }}"
            required
          >
        </div>

        <div class="form-group">
          <label for="description">Description <span style="color: var(--ink-muted); font-weight: 400;">(optional)</span></label>
          <input
            type="text"
            id="description"
            name="description"
            class="form-input"
            maxlength="200"
            placeholder="e.g. Lunch at cafe"
            value="{{ description if description is defined else (expense.description or '') }}"
          >
        </div>

        <button type="submit" class="btn-submit">Save Changes</button>
      </form>

      <div style="margin-top: 1rem; text-align: center;">
        <a href="{{ url_for('profile') }}" style="color: var(--ink-muted); font-size: 0.875rem;">Cancel</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
